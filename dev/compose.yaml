services:
  # Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
    healthcheck:
      # This image has no curl or wget. A successful TCP connect means the
      # server is accepting requests, which is the signal we need here.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Document Parser Service
  doc-parser:
    build:
      context: ../doc-parser
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - GIN_MODE=debug
      # The image ships eng and ind. English alone reads an Indonesian page as
      # near-nothing: a 14-page Indonesian article produced 4 chunks, and the
      # pages that "worked" gave 55 to 100 characters for a full page of text.
      - OCR_LANGUAGES=eng+ind
    volumes:
      - shared_temp:/tmp
    depends_on:
      - qdrant
    # Resource limits to prevent CPU/memory exhaustion during OCR
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 2G
        reservations:
          cpus: '2'
          memory: 1G
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    # Auto-rebuild on Go file changes
    develop:
      watch:
        - action: rebuild
          path: ../doc-parser
          ignore:
            - ../doc-parser/doc-parser

  # API Service
  api:
    image: denoland/deno:2.5.2
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PORT=8000
      - QDRANT_URL=http://qdrant:6333
      - DOC_PARSER_URL=http://doc-parser:8080
      - DENO_V8_FLAGS=--max-old-space-size=6144
    working_dir: /app
    volumes:
      - ../api:/app
      - ../shared:/shared
      - shared_temp:/tmp
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 3G
    # Note: --watch removed to prevent memory issues. Use 'docker compose restart api' after code changes
    command: >
      sh -c "deno run --allow-net --allow-env --allow-read --allow-write --v8-flags=--max-old-space-size=6144,--expose-gc main.ts"
    depends_on:
      - qdrant
      - doc-parser
    healthcheck:
      # This image has no curl or wget. A successful TCP connect means the
      # server is accepting requests, which is the signal we need here.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8000"]
      interval: 30s
      timeout: 10s
      retries: 3

